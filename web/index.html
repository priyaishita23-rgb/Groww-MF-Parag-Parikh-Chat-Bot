<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Support Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/webp" href="/static/brand/logo.webp" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

<!-- A minimal backdrop so the widget has somewhere to sit. Mock data only. -->
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <img class="brand-mark" src="/static/brand/logo.webp" alt="" />
      <img class="brand-word" src="/static/brand/wordmark.png" alt="Groww" />
    </a>
    <span class="brand-sep" aria-hidden="true"></span>
    <button class="navtrigger brand-sub" data-menu="investments"
            aria-haspopup="true" aria-expanded="false">Investments</button>

    <nav class="nav">
      <button class="navtrigger active" data-menu="dashboard"
              aria-haspopup="true" aria-expanded="false">Dashboard</button>
      <button class="navtrigger" data-menu="stocks"
              aria-haspopup="true" aria-expanded="false">Stocks</button>
      <button class="navtrigger" data-menu="funds"
              aria-haspopup="true" aria-expanded="false">Mutual funds</button>
      <button class="navtrigger" data-menu="orders"
              aria-haspopup="true" aria-expanded="false">Orders</button>
    </nav>

    <div class="profile-switch">
      <!-- No visible label: the option text reads fine on its own. The select
           still needs an accessible name, hence aria-label. -->
      <select id="profile" aria-label="Demo profile"></select>
    </div>
  </div>
  <div id="flyout" class="flyout" role="menu" hidden></div>
</header>
<div id="scrim" class="scrim" hidden></div>

<main class="wrap page">
  <div class="page-head">
    <h1>Your dashboard</h1>
    <p class="muted">Prototype with mock data. Nothing here is a real account.</p>
  </div>
  <section class="tiles" id="tiles"></section>
  <section class="hint-card">
    <h2>Try the assistant</h2>
    <p class="muted">Open the chat at the bottom right and ask one of these.</p>
    <div class="hint-grid" id="hints"></div>
  </section>
</main>

<!-- ------------------------------ widget ------------------------------ -->
<button id="launcher" class="launcher" aria-label="Open support chat">
  <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  <span class="launcher-dot"></span>
</button>

<section id="widget" class="widget" aria-live="polite">
  <header class="widget-head">
    <div class="widget-id">
      <span class="avatar"><img src="/static/brand/logo.webp" alt="" /></span>
      <div>
        <strong>Groww Support Assistant</strong>
        <small id="who">—</small>
      </div>
    </div>
    <div class="widget-actions">
      <button id="restart" class="icon-btn" title="Start over" aria-label="Start over">
        <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
      </button>
      <button id="collapse" class="icon-btn" title="Minimise" aria-label="Minimise">
        <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div id="scroll" class="scroll"><div id="thread" class="thread"></div></div>

  <div id="chips" class="chips"></div>

  <form id="composer" class="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Ask about an order, a SIP, or your portfolio…"
           aria-label="Message" />
    <button id="send" type="submit" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <p class="foot">Information and account help only. No investment advice.</p>
</section>

<script src="/static/app.js"></script>
</body>
</html>
